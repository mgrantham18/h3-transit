[package]
name = "h3-transit"
version = "0.1.0"
edition = "2024"
description = "Multi-resolution H3 stochastic road-network travel time index and PIT calibration suite"
license = "MIT"
repository = "https://github.com/mgrantham18/h3-transit"
keywords = ["h3", "routing", "osrm", "spatial-index", "stochastic"]
categories = ["science::geo", "algorithms", "simulation"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
h3o = "0.6"
memmap2 = "0.9"
osmpbf = "0.3"
rand = "0.9"
rand_distr = "0.5"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
statrs = "0.18"
